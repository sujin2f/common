services:
    mongo:
        container_name: mongo
        image: mongo
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
        ports:
            - 27017:27017
    common:
        container_name: common
        image: common
        environment:
            PORT: 80
            MONGO: mongo
        ports:
            - 80:80
        depends_on:
            - mongo
